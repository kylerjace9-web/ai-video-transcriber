
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KY JACE | Client Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 16px;
      background: #090f20;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 430px;
      margin: 45px auto;
    }
    .card {
      background: #151d33;
      border: 1px solid #293653;
      border-radius: 16px;
      padding: 24px;
    }
    h2 { margin-top: 0; }
    p { color: #aab7d0; font-size: 14px; line-height: 1.5; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #34415e;
      background: #0d1528;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #536dfe;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    a { color: #8ca1ff; text-decoration: none; }
    #message { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>KY JACE | Client Login</h2>
      <p>Sign in to access AI Video Studio.</p>

      <form id="loginForm">
        <input id="email" type="email" placeholder="Email address" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">LOGIN</button>
      </form>

      <p id="message"></p>
      <p>Don't have an account? <a href="/register.html">Create Account</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      message.textContent = "";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Login failed.");
        }

        if (data.user.role === "admin") {
          window.location.href = "/admin.html";
        } else {
          window.location.href = "/";
        }
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "LOGIN";
      }
    });
  </script>
</body>
</html>
