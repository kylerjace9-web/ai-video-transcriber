<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f1f5f9;font:16px Arial,sans-serif;padding:16px}h1{font-size:25px}p{color:#cbd5e1}.card{background:#1e293b;padding:14px;border-radius:12px;margin:12px 0}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;font:inherit}textarea{min-height:90px}button{padding:12px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:bold;margin:6px 4px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>🎬 Story Studio</h1>
<p>Gumawa ng cinematic prompts para sa Filipino drama at Google Flow. Maximum na sampung segundo bawat scene.</p>
<div class="card">
<h2>📖 PART SCRIPT</h2>
<label for="partScript">I-paste ang buong script ng Part:</label>
<textarea id="partScript" rows="8" placeholder="I-paste dito ang buong Tagalog story script..."></textarea>
<button onclick="makePrompts()">GENERATE SCENES</button>
<div id="sceneButtons"></div>
<div id="sceneOutput"></div>
</div>

<button onclick="copyText('imageOut')">COPY IMAGE PROMPT</button>
<button onclick="copyText('videoOut')">COPY VIDEO PROMPT</button>
<div class="card"><h2>🖼️ TEXT-TO-IMAGE PROMPT</h2><pre id="imageOut">Punan ang details at pindutin ang Generate.</pre></div>
<div class="card"><h2>🎥 IMAGE-TO-VIDEO PROMPT</h2><pre id="videoOut">Lalabas dito ang video prompt.</pre></div>
<script>

  function v(id) {
  return document.getElementById(id).value.trim() || "Not specified";
}
async function makePrompts() {
  const script = document.getElementById("partScript").value.trim();
  const buttons = document.getElementById("sceneButtons");
  const output = document.getElementById("sceneOutput");

  if (!script) {
    alert("I-paste muna ang buong Part script.");
    return;
  }

  buttons.textContent = "";
  output.textContent = "Ginagawa ang scenes...";

  try {
    const response = await fetch("/api/generate-story", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: `Hatiin ang script sa scenes na hanggang 10 segundo bawat isa. Para sa bawat scene, gumawa ng magkakahiwalay na IMAGE PROMPT, COMPLETE DIALOGUE PREVIEW, VIDEO PROMPT, SFX/AUDIO LOCK, VOICE IDENTITY LOCK, at CONTINUITY LOCK. Panatilihin ang eksaktong dialogue. Lahat ng binibigkas na numero at pera ay isulat sa salitang Tagalog. Vertical 9:16, 1080x1920. Walang subtitles, captions, o watermark.\n\nBUONG PART SCRIPT:\n${script}`
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Hindi nagtagumpay.");

    output.textContent = data.story || "Walang nabuong story.";
  } catch (error) {
    output.textContent = "Error: " + error.message;
  }
}

function copyText(id){let t=document.getElementById(id).textContent;navigator.clipboard.writeText(t).then(()=>alert('Nakopya na!')).catch(()=>alert('Pindutin nang matagal ang prompt at piliin ang Copy.'))}
</script>
</body>
                                                                                                                                                                     </html>
