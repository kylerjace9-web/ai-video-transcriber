<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f1f5f9;font:16px Arial,sans-serif;padding:16px}h1{font-size:25px}p{color:#cbd5e1}.card{background:#1e293b;padding:14px;border-radius:12px;margin:12px 0}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;font:inherit}textarea{min-height:90px}button{padding:12px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:bold;margin:6px 4px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>🎬 Story Studio</h1>
<p>Gumawa ng cinematic prompts para sa Filipino drama at Google Flow. Maximum na sampung segundo bawat scene.</p>
<div class="card">

</div>
<button onclick="makePrompts()">GENERATE BOTH PROMPTS</button>
<button onclick="copyText('imageOut')">COPY IMAGE PROMPT</button>
<button onclick="copyText('videoOut')">COPY VIDEO PROMPT</button>
<div class="card"><h2>🖼️ TEXT-TO-IMAGE PROMPT</h2><pre id="imageOut">Punan ang details at pindutin ang Generate.</pre></div>
<div class="card"><h2>🎥 IMAGE-TO-VIDEO PROMPT</h2><pre id="videoOut">Lalabas dito ang video prompt.</pre></div>
<script>

  function v(id) {
  return document.getElementById(id).value.trim() || "Not specified";
}

async function makePrompts() {
  const btn = document.querySelector('button[onclick="makePrompts()"]');
  const imageOut = document.getElementById("imageOut");
  const videoOut = document.getElementById("videoOut");

  const prompt = [
    "Gumawa ng original na Filipino drama scene prompts para sa Google Flow.",
    "Project: " + v("project"),
    "Part/Episode: " + v("part"),
    "Scene: " + v("scene"),
    "Location at oras: " + v("location"),
    "Characters: " + v("cast"),
    "Kilos at emosyon: " + v("action"),
    "Camera angle: " + v("camera"),
    "Eksaktong dialogue: " + v("dialogue"),
    "Audio at SFX: " + v("audio"),
    "Continuity: " + v("continuity"),
    "Gumawa ng dalawang magkahiwalay na prompt: TEXT-TO-IMAGE at IMAGE-TO-VIDEO.",
    "Vertical 9:16, 1080x1920, photorealistic cinematic Filipino drama.",
    "Video duration maximum 10 seconds. Panatilihin ang mukha, damit, props, lokasyon at lighting.",
    "Tagalog ang dialogue. Isulat sa salitang Tagalog ang lahat ng numerong binibigkas.",
    "Bawat speaker ay magsasalita lamang sa sariling linya. Huwag magdagdag o magbago ng dialogue.",
    "Gawing detalyado ang camera composition, blocking, lighting, audio at continuity.",
    "Ibalik ang dalawang prompt na may malinaw na headings."
  ].join("\n");

  btn.disabled = true;
  imageOut.textContent = "Gumagawa ng prompts...";
  videoOut.textContent = "Sandali lang...";

  try {
    const response = await fetch("/api/generate-story", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt})
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Hindi nagawa ang prompts.");

    const story = data.story || "";
    const split = story.split(/IMAGE-TO-VIDEO PROMPT/i);

    imageOut.textContent = split[0].replace(/TEXT-TO-IMAGE PROMPT/i, "").trim();
    videoOut.textContent = split.length > 1
      ? "IMAGE-TO-VIDEO PROMPT\n" + split.slice(1).join("").trim()
      : story;
  } catch (error) {
    imageOut.textContent = "Error: " + error.message;
    videoOut.textContent = "Pakisubukan ulit.";
  } finally {
    btn.disabled = false;
  }
}
function copyText(id){let t=document.getElementById(id).textContent;navigator.clipboard.writeText(t).then(()=>alert('Nakopya na!')).catch(()=>alert('Pindutin nang matagal ang prompt at piliin ang Copy.'))}
</script>
</body>
                                                                                                                                                                     </html>
