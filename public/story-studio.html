<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f1f5f9;font:16px Arial,sans-serif;padding:16px}h1{font-size:25px}p{color:#cbd5e1}.card{background:#1e293b;padding:14px;border-radius:12px;margin:12px 0}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:white;font:inherit}textarea{min-height:90px}button{padding:12px;border:0;border-radius:8px;background:#38bdf8;color:#082f49;font-weight:bold;margin:6px 4px 6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h1>🎬 Story Studio</h1>
<p>Gumawa ng cinematic prompts para sa Filipino drama at Google Flow. Maximum na sampung segundo bawat scene.</p>
<div class="card">

</div>
<button onclick="makePrompts()">GENERATE BOTH PROMPTS</button>
<button onclick="copyText('imageOut')">COPY IMAGE PROMPT</button>
<button onclick="copyText('videoOut')">COPY VIDEO PROMPT</button>
<div class="card"><h2>🖼️ TEXT-TO-IMAGE PROMPT</h2><pre id="imageOut">Punan ang details at pindutin ang Generate.</pre></div>
<div class="card"><h2>🎥 IMAGE-TO-VIDEO PROMPT</h2><pre id="videoOut">Lalabas dito ang video prompt.</pre></div>
<script>

  function v(id) {
  return document.getElementById(id).value.trim() || "Not specified";
}

async function makePrompts() {
  const imageOut = document.getElementById("imageOut");
  const videoOut = document.getElementById("videoOut");

  const prompt = `
Gumawa ng original na Filipino drama scene.
Project: Ang Oras at Presensya ang Tunay na Pamana
Gumawa ng dalawang magkahiwalay na prompt:
TEXT-TO-IMAGE PROMPT
IMAGE-TO-VIDEO PROMPT

Vertical 9:16, 1080x1920, photorealistic cinematic Filipino drama.
Video maximum 10 seconds.
Tagalog dialogue. Isulat sa salita ang lahat ng numerong binibigkas.
Isang speaker lang sa bawat linya. Huwag magdagdag o magpalit ng dialogue.
Panatilihin ang mukha, damit, props, lokasyon at continuity.
Walang subtitles, captions o watermark.
`;

  imageOut.textContent = "TEXT-TO-IMAGE PROMPT\n\n" + prompt;
  videoOut.textContent = "IMAGE-TO-VIDEO PROMPT\n\n" + prompt;
}
function copyText(id){let t=document.getElementById(id).textContent;navigator.clipboard.writeText(t).then(()=>alert('Nakopya na!')).catch(()=>alert('Pindutin nang matagal ang prompt at piliin ang Copy.'))}
</script>
</body>
                                                                                                                                                                     </html>
